name: CI

# Pełne kontrole na każdym pull requeście i wypchnięciu na dev i prod (repozytorium publiczne, ADR-0086):
# formatowanie, zgodność wersji części, lint, typy, testy oraz build.

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
