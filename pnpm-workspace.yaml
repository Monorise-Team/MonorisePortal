packages:
  - apps/*

# Paczki z zewnątrz instalujemy dopiero 3 dni po publikacji (ochrona łańcucha dostaw, ADR-0076).
# Naszych @monorise-team/* to nie dotyczy (ADR-0087).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@monorise-team/*"

# Skrypty instalacyjne tylko dla zaufanych paczek (esbuild pobiera swój program dla systemu).
allowBuilds:
  esbuild: true
